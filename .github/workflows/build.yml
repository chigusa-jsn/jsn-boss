name: Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jsnboss-jar
          path: build/libs/*.jar

      # v1.0.0 のようなタグを push すると、jar をそのままリリースに置く
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "JSN Boss $GITHUB_REF_NAME" \
            --notes "Minecraft 1.21.1 / NeoForge 用。jar を mods フォルダに入れるだけ。GeckoLib（NeoForge 1.21.1 版 4.7.1 以降）も必要です。"
